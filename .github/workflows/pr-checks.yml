name: "Run PR checks"

on:
  workflow_dispatch: null
  pull_request: null

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn build
